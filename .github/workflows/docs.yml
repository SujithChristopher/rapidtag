name: Documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install documentation tools
        run: python -m pip install maturin numpy "mkdocs>=1.6,<2"
      - name: Build and install RapidTag
        run: maturin develop --release
      - name: Check the Python documentation contract
        run: python scripts/check_docs.py
      - name: Compile and run examples
        run: |
          python -m compileall -q examples scripts/check_docs.py
          python examples/estimate_pose.py
          python examples/estimate_rigid_body_pose.py
      - name: Build the user guide
        run: mkdocs build --strict
      - name: Build warning-free Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items
